name: Проверка JavaScript

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить синтаксис приложения
        run: node --check app.js
      - name: Проверить синтаксис Service Worker
        run: node --check sw.js
