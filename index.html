<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="description" content="Личный список покупок и контроль домашних запасов">
  <title>Кладовая</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Кладовая">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Кладовая"><span class="brand-mark">К</span><span id="pageTitle">Покупки</span></a>
    <button class="icon-button" id="settingsShortcut" aria-label="Настройки">•••</button>
  </header>
  <main id="app" class="page" aria-live="polite"></main>
  <nav class="bottom-nav" aria-label="Основная навигация">
    <button class="nav-item active" data-tab="shopping"><span class="nav-icon">☷</span><span>Покупки</span></button>
    <button class="nav-item" data-tab="stock"><span class="nav-icon">▣</span><span>Запасы</span></button>
    <button class="nav-item" data-tab="catalog"><span class="nav-icon">⌕</span><span>Каталог</span></button>
    <button class="nav-item" data-tab="settings"><span class="nav-icon">⚙</span><span>Настройки</span></button>
  </nav>
  <dialog id="dialog"><form id="dialogForm" method="dialog"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="updateNotice" class="update-notice" hidden><span>Доступно обновление</span><button id="updateButton">Обновить</button></div>
  <input id="backupFile" type="file" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
